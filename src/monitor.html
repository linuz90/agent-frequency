<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Frequency</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f7f7f7;
        --fg: #1d1d1f;
        --fg-muted: #666666;
        --fg-faint: #737373;
        --border: #ebebeb;
        --border-strong: #c7c7c7;
        --live: #0b7a3e;
        --warning: #9a6700;
        --alert: #b42318;
        --focus: #0070f3;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #151515;
          --fg: #ededed;
          --fg-muted: #a1a1a1;
          --fg-faint: #929292;
          --border: #232323;
          --border-strong: #4a4a4a;
          --live: #45d483;
          --warning: #e3b341;
          --alert: #ff8f85;
          --focus: #52a8ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        /* Relative so mono snippets track their surrounding text size instead
           of rendering larger than the prose next to them. */
        font-size: 0.92em;
        font-variant-numeric: tabular-nums;
      }

      .wrap {
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: 28px 32px 56px;
      }

      .skip-link {
        position: fixed;
        z-index: 1;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        transform: translateY(-160%);
      }

      .skip-link:focus {
        transform: translateY(0);
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 32px;
      }

      .identity {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .product-name {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .product-meta {
        color: var(--fg-muted);
        font-size: 12px;
      }

      .view-tabs {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: 6px;
        padding-left: 16px;
        border-left: 1px solid var(--border);
      }

      .view-tab {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border: 0;
        border-bottom: 1px solid transparent;
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .tab-icon {
        width: 13px;
        height: 13px;
        flex: none;
      }

      .view-tab[aria-selected="true"] {
        border-bottom-color: var(--fg);
        color: var(--fg);
      }

      .view-tab:focus-visible {
        border-radius: 2px;
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--fg-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--live);
      }

      .live[data-state="error"] {
        color: var(--alert);
      }

      .live[data-state="error"] .dot {
        background: var(--alert);
      }

      .overview {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(220px, 3fr);
        align-items: end;
        gap: 32px;
        padding: 72px 0 40px;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(34px, 4.5vw, 58px);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.06;
        text-wrap: balance;
      }

      .overview-copy {
        max-width: 36ch;
        margin: 0 0 3px;
        color: var(--fg-muted);
      }

      .overview-aside {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .project-filter {
        display: inline-grid;
        grid-template-columns: 14px minmax(0, 1fr) 14px;
        align-items: center;
        width: min(100%, 240px);
        height: 32px;
        padding: 0 9px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg-muted);
      }

      .project-filter[hidden] {
        display: none;
      }

      .project-filter:focus-within {
        border-color: var(--focus);
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .project-filter svg {
        width: 14px;
        height: 14px;
        pointer-events: none;
      }

      .project-filter select {
        min-width: 0;
        height: 100%;
        padding: 0 7px;
        overflow: hidden;
        border: 0;
        outline: 0;
        appearance: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      #traffic {
        border-top: 1px solid var(--border-strong);
      }

      .group {
        padding-top: 36px;
      }

      .group-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .group-name {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--fg);
        font-size: 12px;
        font-weight: 500;
      }

      .group-meta {
        margin: 0;
        color: var(--fg-faint);
        font-size: 12px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .card {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: start;
        gap: 12px;
        padding: 14px 0 15px;
        border-bottom: 1px solid var(--border);
      }

      .agent {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 8px;
        min-width: 0;
      }

      .agent-label {
        max-width: 100%;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .agent-name {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        min-width: 0;
      }

      .client-surface {
        color: var(--fg-muted);
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
      }

      .card-avatar,
      .activity-avatar {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--fg-muted);
      }

      .provider-icon {
        width: 14px;
        height: 14px;
        flex: none;
        color: var(--fg);
      }

      .agent-session {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        min-width: 0;
      }

      .agent-id {
        display: block;
        max-width: 100%;
        color: var(--fg-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-kind {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--fg-muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .session-kind svg {
        width: 12px;
        height: 12px;
        flex: none;
      }

      .card-content {
        min-width: 0;
        max-width: 820px;
      }

      .card-byline {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        min-height: 19px;
      }

      .expiry {
        margin-left: auto;
        color: var(--fg-muted);
        font-size: 12px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .summary {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 3px 12px;
        margin: 6px 2px 0;
        color: var(--fg-muted);
        font-size: 12px;
      }

      .meta .path {
        overflow-wrap: anywhere;
      }

      .dirty[data-state="dirty"] {
        color: var(--alert);
      }

      .status[data-status="partial"] {
        color: var(--warning);
      }

      .status[data-status="blocked"] {
        color: var(--alert);
      }

      .activity-call {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: start;
        gap: 12px;
        padding-top: 18px;
      }

      .activity-call + .activity-call {
        margin-top: 14px;
      }

      .card-avatar .provider-icon,
      .activity-avatar .provider-icon {
        width: 17px;
        height: 17px;
      }

      .completion-icon {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .activity-call[data-state="done"] .activity-avatar,
      .activity-call[data-state="done"] .activity-bubble {
        border-color: var(--live);
      }

      .activity-call[data-state="done"] .activity-avatar,
      .activity-call[data-state="done"] .activity-verb {
        color: var(--live);
      }

      .activity-message {
        max-width: 820px;
        min-width: 0;
      }

      .activity-byline {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        min-height: 19px;
      }

      .activity-speaker {
        font-weight: 600;
      }

      .activity-short-id {
        min-width: 0;
        overflow: hidden;
        color: var(--fg-faint);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity-age {
        margin-left: auto;
        color: var(--fg-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .speech-bubble {
        margin-top: 4px;
        padding: 10px 13px 11px;
        border: 1px solid var(--border);
        border-radius: 3px 10px 10px;
        background: var(--surface);
      }

      .activity-summary {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .activity-context {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 7px 2px 0;
        color: var(--fg-muted);
        font-size: 12px;
      }

      .activity-origin,
      .activity-outcome {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
      }

      .activity-verb {
        color: var(--fg);
      }

      .activity-status {
        font-weight: 500;
      }

      .activity-status[data-status="granted"] {
        color: var(--live);
      }

      .activity-status[data-status="completed"] {
        color: var(--live);
      }

      .activity-status[data-status="partial"] {
        color: var(--warning);
      }

      .activity-status[data-status="blocked"] {
        color: var(--alert);
      }

      .badges {
        margin-top: 12px;
        border-top: 1px solid var(--border);
      }

      .badge {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 16px;
        min-width: 0;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        color: var(--fg-muted);
      }

      .badge .mono {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .badge .access {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.92em;
        color: var(--fg-faint);
      }

      .badge[data-access="exclusive"] {
        color: var(--fg);
      }

      .badge[data-access="exclusive"] .access {
        color: var(--alert);
      }

      details {
        margin-top: 10px;
      }

      .agent-details {
        margin: 7px 2px 0;
      }

      .agent-details summary {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        font-size: 12px;
      }

      .agent-details .exclusive-count {
        color: var(--alert);
      }

      .detail-section {
        margin-top: 10px;
      }

      .detail-label {
        margin: 0 0 4px;
        color: var(--fg-faint);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .detail-section .badges,
      .detail-section .paths {
        margin-top: 0;
      }

      summary {
        cursor: pointer;
        color: var(--fg-muted);
        list-style: none;
        width: fit-content;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::before {
        content: "+";
        display: inline-block;
        width: 16px;
        color: var(--fg-faint);
      }

      details[open] summary::before {
        content: "−";
      }

      summary:focus-visible {
        border-radius: 2px;
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .paths {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        color: var(--fg-muted);
      }

      .paths li {
        padding: 2px 0 2px 16px;
        overflow-wrap: anywhere;
      }

      .empty {
        margin: 0;
        padding: 28px 0;
        border-bottom: 1px solid var(--border);
        color: var(--fg-muted);
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 44px;
        color: var(--fg-faint);
        font-size: 12px;
      }

      footer::after {
        content: "Local state only";
      }

      @media (max-width: 760px) {
        .wrap {
          padding: 24px 20px 44px;
        }

        .overview {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 52px 0 30px;
        }

        h1 {
          font-size: clamp(34px, 9vw, 48px);
        }

        .overview-copy {
          max-width: 46ch;
          margin: 0;
        }

        .overview-aside {
          gap: 14px;
        }

        .group {
          padding-top: 30px;
        }

        .card {
          grid-template-columns: 30px minmax(0, 1fr);
          gap: 10px;
          padding: 13px 0 14px;
        }

        .card-avatar {
          width: 30px;
          height: 30px;
        }
      }

      @media (max-width: 480px) {
        .wrap {
          padding-inline: 16px;
        }

        .masthead,
        .identity {
          align-items: flex-start;
        }

        .identity {
          flex-wrap: wrap;
        }

        .view-tabs {
          flex-basis: 100%;
          margin: 2px 0 0;
          padding: 8px 0 0;
          border-top: 1px solid var(--border);
          border-left: 0;
        }

        .live {
          align-items: baseline;
          white-space: normal;
          text-align: right;
        }

        .group-head {
          align-items: baseline;
        }

        .activity-call {
          grid-template-columns: 30px minmax(0, 1fr);
          gap: 9px;
        }

        .activity-avatar {
          width: 30px;
          height: 30px;
        }

        .activity-byline {
          gap: 6px;
        }

        .speech-bubble {
          margin-top: 3px;
          padding: 9px 12px 10px;
        }

        .badge {
          grid-template-columns: 1fr;
          gap: 2px;
        }

        footer::after {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="skip-link" href="#main">Skip to traffic</a>
      <header class="masthead">
        <div class="identity">
          <span class="product-name">Agent Frequency</span>
          <span class="product-meta">Read-only monitor</span>
          <nav class="view-tabs" aria-label="Monitor view" role="tablist">
            <button class="view-tab" id="agents-tab" type="button" role="tab" aria-controls="main">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 21a8 8 0 0 0-16 0"></path>
                <circle cx="10" cy="8" r="5"></circle>
                <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path>
              </svg>
              Agents
            </button>
            <button class="view-tab" id="activity-tab" type="button" role="tab" aria-controls="main">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path>
              </svg>
              Activity
            </button>
          </nav>
        </div>
        <div class="live" id="live" data-state="idle" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span><span id="live-text">connecting</span>
        </div>
      </header>
      <section class="overview" aria-labelledby="count">
        <h1 id="count">Listening for nearby work.</h1>
        <div class="overview-aside">
          <p class="overview-copy" id="overview-copy">
            Active agents and their claimed scopes will appear here automatically.
          </p>
          <label class="project-filter" id="project-filter" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 5h18"></path>
              <path d="M6 12h12"></path>
              <path d="M10 19h4"></path>
            </svg>
            <select id="project-filter-select" aria-label="Filter agents by project">
              <option value="">All projects</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </label>
        </div>
      </section>
      <main id="traffic"><div id="main" role="tabpanel" tabindex="0"></div></main>
      <footer id="footer"></footer>
    </div>

    <script>
      // Every value below (summaries, labels, branches, paths, claim paths) is
      // peer-authored and untrusted. The page therefore builds DOM nodes and
      // assigns textContent only; nothing here ever assembles markup from data.
      (function () {
        "use strict";

        var UI_VERSION = "__AGENT_FREQUENCY_UI_VERSION__";
        var REFRESH_MS = 3000;
        var TICK_MS = 1000;

        var main = document.getElementById("main");
        var footer = document.getElementById("footer");
        var countEl = document.getElementById("count");
        var overviewCopyEl = document.getElementById("overview-copy");
        var liveEl = document.getElementById("live");
        var liveTextEl = document.getElementById("live-text");
        var agentsTabEl = document.getElementById("agents-tab");
        var activityTabEl = document.getElementById("activity-tab");
        var projectFilterEl = document.getElementById("project-filter");
        var projectFilterSelectEl = document.getElementById("project-filter-select");

        var timeNodes = [];
        var clockOffsetMs = 0;
        var lastSuccessMs = null;
        var failing = false;
        var lastSignature = null;
        var latestState = null;
        var activeView = window.location.hash === "#activity" ? "activity" : "agents";
        var selectedRepo = new URLSearchParams(window.location.search).get("repo") || "";
        var repoOptionsSignature = null;
        // Expanded path lists survive re-renders; a three-second refresh must
        // not keep closing a list the user just opened.
        var openDetails = new Set();

        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }

        var SVG_NS = "http://www.w3.org/2000/svg";

        function svgEl(className, viewBox) {
          var node = document.createElementNS(SVG_NS, "svg");
          node.setAttribute("class", className);
          node.setAttribute("viewBox", viewBox || "0 0 24 24");
          node.setAttribute("aria-hidden", "true");
          return node;
        }

        function svgShape(parent, tag, attributes) {
          var node = document.createElementNS(SVG_NS, tag);
          Object.keys(attributes).forEach(function (name) {
            node.setAttribute(name, attributes[name]);
          });
          parent.appendChild(node);
        }

        // Provider labels only select one of these fixed trusted marks. Peer
        // text never enters SVG markup, preserving the page's injection boundary.
        function providerIcon(agentLabel, agentId) {
          var identity = ((agentLabel || "") + " " + (agentId || "")).toLowerCase();
          var icon = svgEl("provider-icon");

          if (identity.indexOf("codex") !== -1 || identity.indexOf("openai") !== -1) {
            icon.setAttribute("fill", "currentColor");
            svgShape(icon, "path", {

        function forkIcon() {

          icon.setAttribute("stroke-width", "2.5");

          icon.setAttribute("stroke-linejoin", "round");
          svgShape(icon, "path", { d: "m5 12 4 4L19 6" });

        }

        function now() {
          return Date.now() + clockOffsetMs;
        }

        function formatDuration(ms) {
          var seconds = Math.max(0, Math.round(ms / 1000));
          if (seconds < 60) return seconds + "s";
          var minutes = Math.floor(seconds / 60);
          if (minutes < 60) return minutes + "m";
          var hours = Math.floor(minutes / 60);
          var rest = minutes % 60;
          return rest === 0 ? hours + "h" : hours + "h " + rest + "m";
        }

        function formatExpiry(expiresAtMs) {
          var remaining = expiresAtMs - now();
          return remaining <= 0 ? "expired" : "expires in " + formatDuration(remaining);
        }

        function formatAge(atMs) {
          var elapsed = now() - atMs;
          if (elapsed < 10000) return "updated just now";
          return "updated " + formatDuration(elapsed) + " ago";
        }

        function formatEventAge(atMs) {
          var elapsed = now() - atMs;
          if (elapsed < 10000) return "just now";
          return formatDuration(elapsed) + " ago";
        }

        function trackTime(node, kind, atMs) {
          timeNodes.push({ node: node, kind: kind, atMs: atMs });
          node.textContent =
            kind === "expiry"
              ? formatExpiry(atMs)
              : kind === "event"
                ? formatEventAge(atMs)
                : formatAge(atMs);
        }

        function abbreviate(path, homeDir) {
          if (!homeDir || !path) return path || "";
          if (path === homeDir) return "~";
          if (path.indexOf(homeDir + "/") === 0) return "~" + path.slice(homeDir.length);
          return path;
        }

        function shortAgentId(agentId, agentLabel) {
          var id = agentId || "Agent";
          var prefix = (agentLabel || "") + " ";
          var compact = prefix.trim() && id.indexOf(prefix) === 0 ? id.slice(prefix.length) : id;
          return compact.length > 10
            ? compact.slice(0, 4) + "…" + compact.slice(compact.length - 4)
            : compact;
        }

        function surfaceLabel(surface) {
          if (surface === "t3-code") return "T3 Code";
          if (surface === "codex-app") return "Codex app";
          if (surface === "claude-app") return "Claude app";
          if (surface === "cli") return "CLI";
          return null;
        }

        function renderAgentIdentity(agentLabel, agentId, clientSurface, sameWorktree) {
          var label = agentLabel || agentId || "Agent";
          var agent = el("div", "agent");
          var name = el("div", "agent-name");
          name.appendChild(el("span", "agent-label", label));
          var surface = surfaceLabel(clientSurface);
          if (surface) name.appendChild(el("span", "client-surface", "via " + surface));
          agent.appendChild(name);

          var session = el("div", "agent-session");
          var id = el("span", "agent-id mono", "session " + shortAgentId(agentId, label));
          id.title = agentId || label;
          session.appendChild(id);
          if (sameWorktree) {
            var kind = el("span", "session-kind", "same worktree");
            kind.prepend(forkIcon());
            session.appendChild(kind);
          }
          agent.appendChild(session);
          return agent;
        }

        function activityStatus(event) {
          if (event.agent_state === "done") return "claims released";
          if (event.requested_scope_count === 0) return "listening only";
          if (event.status === "partial") return "some scopes blocked";
          if (event.status === "blocked") return "blocked by an active claim";
          return "no known conflict";
        }

        function activityScopes(event) {
          if (event.agent_state === "done") return null;
          if (event.requested_scope_count === 0) return null;
          if (event.status === "partial") {
            return (
              event.granted_scope_count +
              " clear · " +
              event.blocked_scope_count +
              " blocked"
            );
          }
          if (event.status === "blocked") {
            return (
              event.blocked_scope_count +
              " scope" +
              (event.blocked_scope_count === 1 ? "" : "s") +
              " in conflict"
            );
          }
          return (
            event.granted_scope_count +
            " scope" +
            (event.granted_scope_count === 1 ? "" : "s") +
            " claimed"
          );
        }

        function groupByRepo(leases) {
          var order = [];
          // Repository names are peer-controlled. A Map keeps names such as
          // "__proto__" from resolving inherited Object properties.
          var groups = new Map();
          leases.forEach(function (lease) {
            var key = lease.repo_name || "unknown repo";
            if (!groups.has(key)) {
              groups.set(key, []);
              order.push(key);
            }
            groups.get(key).push(lease);
          });
          return order.map(function (key) {
            return { name: key, leases: groups.get(key) };
          });
        }

        function repoName(item) {
          return item.repo_name || "unknown repo";
        }

        function repoNames(leases) {
          return Array.from(
            leases.reduce(function (names, lease) {
              names.add(repoName(lease));
              return names;
            }, new Set())
          ).sort(function (left, right) {
            return left.localeCompare(right);
          });
        }

        function syncProjectFilter(state) {
          var activeRepos = repoNames(state.leases);
          var options = activeRepos.slice();
          // Keep a selected project available long enough to clear it when its
          // final agent expires during a live refresh.
          if (selectedRepo && options.indexOf(selectedRepo) === -1) options.push(selectedRepo);
          var signature = JSON.stringify(options);
          if (signature !== repoOptionsSignature) {
            var allOption = document.createElement("option");
            allOption.value = "";
            allOption.textContent = "All projects";
            var optionNodes = [allOption];
            options.forEach(function (repo) {
              var option = document.createElement("option");
              option.value = repo;
              option.textContent = repo;
              optionNodes.push(option);
            });
            projectFilterSelectEl.replaceChildren.apply(projectFilterSelectEl, optionNodes);
            repoOptionsSignature = signature;
          }
          projectFilterSelectEl.value = selectedRepo;
          projectFilterEl.hidden =
            activeView !== "agents" || (activeRepos.length < 2 && selectedRepo === "");
        }

        function visibleLeases(state) {
          if (!selectedRepo) return state.leases;
          return state.leases.filter(function (lease) {
            return repoName(lease) === selectedRepo;
          });
        }

        function renderDirty(lease) {
          if (lease.dirty_count) {
            return lease.dirty_count + " dirty file" + (lease.dirty_count === 1 ? "" : "s");
          }
          if (lease.dirty === true) return "dirty";
          if (lease.dirty === false || lease.dirty_count === 0) return "clean";
          return null;
        }

        function renderPaths(paths, truncated) {
          var list = el("ul", "paths mono");
          paths.forEach(function (path) {
            list.appendChild(el("li", null, path));
          });
          if (truncated > 0) {
            list.appendChild(el("li", null, "and " + truncated + " more"));
          }
          return list;
        }

        function sessionClusterKey(lease) {
          if (!lease.worktree_root) return null;
          return (lease.agent_label || lease.agent_id || "Agent").toLowerCase() + "\u0000" + lease.worktree_root;
        }

        function countSessionClusters(leases) {
          var counts = new Map();
          leases.forEach(function (lease) {
            var key = sessionClusterKey(lease);
            if (key) counts.set(key, (counts.get(key) || 0) + 1);
          });
          return counts;
        }

        function renderCard(lease, homeDir, sameWorktree) {
          var card = el("article", "card");
          var label = lease.agent_label || lease.agent_id || "Agent";
          var avatar = el("div", "card-avatar");
          avatar.setAttribute("aria-hidden", "true");
          avatar.appendChild(providerIcon(label, lease.agent_id));
          card.appendChild(avatar);

          var content = el("div", "card-content");
          var byline = el("div", "card-byline");
          byline.appendChild(
            renderAgentIdentity(
              lease.agent_label,
              lease.agent_id,
              lease.client_surface,
              sameWorktree
            )
          );
          var expiry = el("span", "expiry");
          trackTime(expiry, "expiry", lease.expires_at_ms);
          byline.appendChild(expiry);
          content.appendChild(byline);

          if (lease.summary) {
            var bubble = el("div", "speech-bubble agent-bubble");
            bubble.appendChild(el("p", "summary", lease.summary));
            content.appendChild(bubble);
          }

          var meta = el("div", "meta");
          if (lease.branch) meta.appendChild(el("span", "mono", lease.branch));
          if (lease.worktree_root) {
            meta.appendChild(el("span", "mono path", abbreviate(lease.worktree_root, homeDir)));
          }
          var dirty = renderDirty(lease);
          if (dirty) {
            var dirtyEl = el("span", "dirty", dirty);
            dirtyEl.setAttribute(
              "data-state",
              lease.dirty === true || (lease.dirty_count || 0) > 0 ? "dirty" : "clean"
            );
            meta.appendChild(dirtyEl);
          }
          if (lease.metadata_complete === false) {
            meta.appendChild(el("span", null, "partial git metadata"));
          }
          var updated = el("span", null);
          if (lease.updated_at_ms) {
            trackTime(updated, "age", lease.updated_at_ms);
            meta.appendChild(updated);
          }
          if (meta.childNodes.length > 0) content.appendChild(meta);

          var paths = lease.dirty_paths || [];
          if (lease.claims.length > 0 || paths.length > 0) {
            var key = lease.agent_id + "\u0000" + lease.worktree_root;
            var details = el("details", "agent-details");
            details.agentFrequencyKey = key;
            details.open = openDetails.has(key);
            details.addEventListener("toggle", function () {
              if (details.open) openDetails.add(key);
              else openDetails.delete(key);
            });

            var disclosure = el("summary");
            if (lease.claims.length > 0) {
              disclosure.appendChild(
                el(
                  "span",
                  null,
                  lease.claims.length + " scope" + (lease.claims.length === 1 ? "" : "s")
                )
              );
              var exclusiveCount = lease.claims.filter(function (claim) {
                return claim.access === "exclusive";
              }).length;
              if (exclusiveCount > 0) {
                disclosure.appendChild(
                  el(
                    "span",
                    "exclusive-count",
                    exclusiveCount + " exclusive"
                  )
                );
              }
            }
            if (paths.length > 0) {
              var changedPathCount = paths.length + (lease.dirty_paths_truncated || 0);
              disclosure.appendChild(
                el(
                  "span",
                  null,
                  changedPathCount + " changed path" + (changedPathCount === 1 ? "" : "s")
                )
              );
            }
            details.appendChild(disclosure);

            if (lease.claims.length > 0) {
              var claimsSection = el("div", "detail-section");
              claimsSection.appendChild(el("p", "detail-label", "Claimed scopes"));
              var badges = el("div", "badges");
              lease.claims.forEach(function (claim) {
                var badge = el("span", "badge");
                badge.setAttribute("data-access", claim.access === "exclusive" ? "exclusive" : "shared");
                badge.appendChild(el("span", "mono", claim.path));
                badge.appendChild(el("span", "access", claim.access));
                badges.appendChild(badge);
              });
              claimsSection.appendChild(badges);
              details.appendChild(claimsSection);
            }

            if (paths.length > 0) {
              var pathsSection = el("div", "detail-section");
              pathsSection.appendChild(el("p", "detail-label", "Changed paths"));
              pathsSection.appendChild(renderPaths(paths, lease.dirty_paths_truncated));
              details.appendChild(pathsSection);
            }
            content.appendChild(details);
          }

          card.appendChild(content);
          return card;
        }

        function renderAgents(state) {
          var fragment = document.createDocumentFragment();
          var leases = visibleLeases(state);
          var groups = groupByRepo(leases);
          var sessionClusters = countSessionClusters(leases);

          if (state.leases.length === 0) {
            countEl.textContent = "The frequency is quiet.";
            overviewCopyEl.textContent = state.database_available
              ? "No active leases right now. New announcements will appear automatically."
              : "Nothing has announced on this machine yet. New traffic will appear automatically.";
            fragment.appendChild(el("p", "empty", "No active traffic to show."));
          } else if (leases.length === 0) {
            countEl.textContent = "No active agents in " + selectedRepo + ".";
            overviewCopyEl.textContent =
              "This filter will stay active as new announcements arrive.";
            fragment.appendChild(el("p", "empty", "No active agents to show for this project."));
          } else {
            var exclusiveCount = leases.reduce(function (total, lease) {
              return (
                total +
                lease.claims.filter(function (claim) {
                  return claim.access === "exclusive";
                }).length
              );
            }, 0);
            countEl.textContent = selectedRepo
              ? leases.length +
                " active agent" +
                (leases.length === 1 ? " is" : "s are") +
                " working in " +
                selectedRepo +
                "."
              : leases.length +
                " active agent" +
                (leases.length === 1 ? " is" : "s are") +
                " working nearby.";
            overviewCopyEl.textContent = selectedRepo
              ? "Filtered from " +
                state.leases.length +
                " active agent" +
                (state.leases.length === 1 ? "" : "s") +
                ", with " +
                (exclusiveCount === 0
                  ? "no exclusive scopes claimed."
                  : exclusiveCount +
                    " exclusive scope" +
                    (exclusiveCount === 1 ? "" : "s") +
                    " claimed.")
              : groups.length +
                " repositor" +
                (groups.length === 1 ? "y" : "ies") +
                " in view, with " +
              (exclusiveCount === 0
                ? "no exclusive scopes claimed."
                : exclusiveCount +
                  " exclusive scope" +
                  (exclusiveCount === 1 ? "" : "s") +
                  " claimed.");
            groups.forEach(function (group) {
              var section = el("section", "group");
              var head = el("div", "group-head");
              head.appendChild(el("h2", "group-name mono", group.name));
              head.appendChild(
                el(
                  "p",
                  "group-meta",
                  group.leases.length + " agent" + (group.leases.length === 1 ? "" : "s")
                )
              );
              section.appendChild(head);
              group.leases.forEach(function (lease) {
                var clusterKey = sessionClusterKey(lease);
                section.appendChild(
                  renderCard(
                    lease,
                    state.home_dir,
                    clusterKey !== null && (sessionClusters.get(clusterKey) || 0) > 1
                  )
                );
              });
              fragment.appendChild(section);
            });
          }

          return fragment;
        }

        function renderActivity(state) {
          var fragment = document.createDocumentFragment();
          var events = state.events || [];

          countEl.textContent =
            state.event_count === 0
              ? "No recent calls yet."
              : state.event_count +
                " call" +
                (state.event_count === 1 ? "" : "s") +
                " on the frequency.";
          overviewCopyEl.textContent =
            state.event_count === 0
              ? "New agent announcements, check-ins, and completions will appear here."
              : state.events_truncated > 0
                ? "Showing the newest " + events.length + " calls from the seven-day activity window."
                : "Agents announcing work, checking in, and marking it complete.";

          if (events.length === 0) {
            fragment.appendChild(el("p", "empty", "The frequency is quiet."));
            return fragment;
          }

          var section = el("section", "group");
          var head = el("div", "group-head");
          head.appendChild(el("h2", "group-name mono", "recent calls"));
          head.appendChild(
            el(
              "p",
              "group-meta",
              state.events_truncated > 0
                ? events.length + " shown · " + state.events_truncated + " older"
                : events.length + " call" + (events.length === 1 ? "" : "s")
            )
          );
          section.appendChild(head);

          events.forEach(function (event) {
            var call = el("article", "activity-call");
            call.setAttribute("data-state", event.agent_state === "done" ? "done" : "working");
            var label = event.agent_label || event.agent_id;
            var avatar = el("div", "activity-avatar");
            avatar.setAttribute("aria-hidden", "true");
            avatar.appendChild(
              event.agent_state === "done" ? completionIcon() : providerIcon(label, event.agent_id)
            );
            call.appendChild(avatar);

            var message = el("div", "activity-message");
            var byline = el("div", "activity-byline");
            byline.appendChild(el("span", "activity-speaker", label));
            var surface = surfaceLabel(event.client_surface);
            if (surface) byline.appendChild(el("span", "client-surface", "via " + surface));
            byline.appendChild(
              el("span", "activity-short-id mono", "session " + shortAgentId(event.agent_id, label))
            );
            var timestamp = el("time", "activity-age");
            trackTime(timestamp, "event", event.created_at_ms);
            byline.appendChild(timestamp);
            message.appendChild(byline);

            var bubble = el("div", "speech-bubble activity-bubble");
            bubble.appendChild(el("p", "activity-summary", event.summary));
            message.appendChild(bubble);

            var context = el("div", "activity-context");
            var origin = el("div", "activity-origin");
            origin.appendChild(
              el(
                "span",
                "activity-verb",
                event.agent_state === "done"
                  ? "completed work"
                  : event.event_type === "renewed"
                    ? "checked in again"
                    : "announced work"
              )
            );
            origin.appendChild(el("span", null, "in"));
            origin.appendChild(
              el(
                "span",
                "mono",
                (event.repo_name || "unknown repo") + (event.branch ? " / " + event.branch : "")
              )
            );
            context.appendChild(origin);

            var outcome = el("div", "activity-outcome");
            var status = el("span", "activity-status", activityStatus(event));
            status.setAttribute(
              "data-status",
              event.agent_state === "done" ? "completed" : event.status
            );
            outcome.appendChild(status);
            var scopeText = activityScopes(event);
            if (scopeText) outcome.appendChild(el("span", null, scopeText));
            outcome.appendChild(
              el(
                "span",
                null,
                event.peer_count > 0
                  ? "heard " +
                      event.peer_count +
                      " agent" +
                      (event.peer_count === 1 ? "" : "s") +
                      " nearby"
                  : "heard no other agents"
              )
            );
            context.appendChild(outcome);
            message.appendChild(context);
            call.appendChild(message);
            section.appendChild(call);
          });

          fragment.appendChild(section);
          return fragment;
        }

        function syncViewTabs() {
          var agentsActive = activeView === "agents";
          agentsTabEl.setAttribute("aria-selected", agentsActive ? "true" : "false");
          agentsTabEl.tabIndex = agentsActive ? 0 : -1;
          activityTabEl.setAttribute("aria-selected", agentsActive ? "false" : "true");
          activityTabEl.tabIndex = agentsActive ? -1 : 0;
          main.setAttribute("aria-labelledby", agentsActive ? "agents-tab" : "activity-tab");
        }

        function setActiveView(view) {
          if (view === activeView) return;
          activeView = view;
          window.history.replaceState(
            null,
            "",
            view === "activity"
              ? window.location.pathname + window.location.search + "#activity"
              : window.location.pathname + window.location.search
          );
          syncViewTabs();
          lastSignature = null;
          if (latestState) render(latestState);
        }

        function render(state) {
          var focusedDetailsKey = null;
          var focusedElement = document.activeElement;
          if (focusedElement && focusedElement.tagName === "SUMMARY") {
            var focusedDetails = focusedElement.closest(".agent-details");
            if (focusedDetails) focusedDetailsKey = focusedDetails.agentFrequencyKey;
          }
          timeNodes = [];
          syncProjectFilter(state);
          main.replaceChildren(
            activeView === "activity" ? renderActivity(state) : renderAgents(state)
          );
          if (focusedDetailsKey !== null) {
            Array.prototype.some.call(
              main.querySelectorAll(".agent-details"),
              function (details) {
                if (details.agentFrequencyKey !== focusedDetailsKey) return false;
                var disclosure = details.querySelector("summary");
                if (disclosure) disclosure.focus();
                return true;
              }
            );
          }
          footer.textContent = state.database_available
            ? "Schema v" + (state.schema_version === null ? "?" : state.schema_version)
            : "No state database";
        }

        function tick() {
          timeNodes.forEach(function (entry) {
            entry.node.textContent =
              entry.kind === "expiry"
                ? formatExpiry(entry.atMs)
                : entry.kind === "event"
                  ? formatEventAge(entry.atMs)
                  : formatAge(entry.atMs);
          });
          if (failing) {
            setLiveText(lastSuccessMs ? "refresh failed" : "cannot reach monitor");
          } else if (lastSuccessMs) {
            setLiveText("live");
          }
        }

        function setLiveText(text) {
          // The live region should announce state transitions, not a timer tick.
          if (liveTextEl.textContent !== text) liveTextEl.textContent = text;
        }

        function refresh() {
          var basePath = window.location.pathname.replace(/\/?$/, "/");
          fetch(basePath + "api/state", { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) throw new Error("bad status " + response.status);
              // Data already refreshes in place. This header also lets an
              // open tab replace its own HTML/CSS after a monitor UI edit.
              var serverUiVersion = response.headers.get("x-agent-frequency-ui-version");
              if (serverUiVersion && serverUiVersion !== UI_VERSION) {
                window.location.reload();
                return null;
              }
              return response.json();
            })
            .then(function (state) {
              if (state === null) return;
              // Countdowns are computed against the server clock so an offset
              // between the browser and the announcing agents cannot make a
              // live lease look expired.
              clockOffsetMs = state.now_ms - Date.now();
              latestState = state;
              lastSuccessMs = Date.now();
              failing = false;
              liveEl.setAttribute("data-state", "ok");
              // Re-render only on real change, so text selection and scroll
              // position survive an idle frequency.
              var signature = JSON.stringify([
                state.database_available,
                state.schema_version,
                activeView,
                selectedRepo,
                state.leases,
                state.event_count,
                state.events_truncated,
                state.events,
              ]);
              if (signature !== lastSignature) {
                lastSignature = signature;
                render(state);
              }
              tick();
            })
            .catch(function () {
              failing = true;
              liveEl.setAttribute("data-state", "error");
              tick();
            });
        }

        agentsTabEl.addEventListener("click", function () {
          setActiveView("agents");
        });
        activityTabEl.addEventListener("click", function () {
          setActiveView("activity");
        });
        projectFilterSelectEl.addEventListener("change", function () {
          selectedRepo = projectFilterSelectEl.value;
          var url = new URL(window.location.href);
          if (selectedRepo) url.searchParams.set("repo", selectedRepo);
          else url.searchParams.delete("repo");
          window.history.replaceState(null, "", url.pathname + url.search + url.hash);
          lastSignature = null;
          if (latestState) render(latestState);
        });
        agentsTabEl.parentElement.addEventListener("keydown", function (event) {
          var view =
            event.key === "ArrowLeft" || event.key === "Home"
              ? "agents"
              : event.key === "ArrowRight" || event.key === "End"
                ? "activity"
                : null;
          if (!view) return;
          event.preventDefault();
          setActiveView(view);
          (view === "agents" ? agentsTabEl : activityTabEl).focus();
        });
        syncViewTabs();
        refresh();
        setInterval(refresh, REFRESH_MS);
        setInterval(tick, TICK_MS);
      })();
    </script>
  </body>
</html>
